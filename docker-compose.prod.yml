name: tide-final-grading

services:
  db:
    extends:
      file: compose.base.yml
      service: db

  backend:
    extends:
      file: compose.base.yml
      service: backend
    build:
      target: production
    environment:
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN}
      AUTH_COOKIE_SECURE: "true"
      TRUST_PROXY: "1"

  agent:
    extends:
      file: compose.base.yml
      service: agent
    build:
      target: production

  frontend:
    extends:
      file: compose.base.yml
      service: frontend
    build:
      target: production
      args:
        VITE_API_URL: /api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  caddy:
    build:
      context: ./deploy/caddy
      dockerfile: Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
      - "${HTTPS_PORT:-443}:8443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
