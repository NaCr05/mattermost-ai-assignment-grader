name: tide-final-grading

services:
  db:
    extends:
      file: compose.base.yml
      service: db

  backend:
    extends:
      file: compose.base.yml
      service: backend
    build:
      target: production
    environment:
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN}
      AUTH_COOKIE_SECURE: "true"
      TRUST_PROXY: "1"

  agent:
    extends:
      file: compose.base.yml
      service: agent
    build:
      target: production

  frontend:
    extends:
      file: compose.base.yml
      service: frontend
    build:
      target: production
      args:
        VITE_API_URL: /api
    ports:
      - "${HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
