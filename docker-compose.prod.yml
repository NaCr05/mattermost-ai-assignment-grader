name: tide-final-grading

services:
  db:
    extends:
      file: compose.base.yml
      service: db
    restart: unless-stopped

  backend:
    extends:
      file: compose.base.yml
      service: backend
    image: ${BACKEND_IMAGE:?Download release-images.env from the v0.2.0 release}
    pull_policy: missing
    restart: unless-stopped
    environment:
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN}
      AUTH_COOKIE_SECURE: "true"
      TRUST_PROXY: "1"

  agent:
    extends:
      file: compose.base.yml
      service: agent
    image: ${AGENT_IMAGE:?Download release-images.env from the v0.2.0 release}
    pull_policy: missing
    restart: unless-stopped

  frontend:
    extends:
      file: compose.base.yml
      service: frontend
    image: ${FRONTEND_IMAGE:?Download release-images.env from the v0.2.0 release}
    pull_policy: missing
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  caddy:
    image: ${CADDY_IMAGE:?Download release-images.env from the v0.2.0 release}
    pull_policy: missing
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
      - "${HTTPS_PORT:-443}:8443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      frontend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-5}"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
