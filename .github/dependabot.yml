version: 2
# 维护模式：停止常规版本升级 PR。Dependabot alerts 与安全更新保持启用。
updates:
  - package-ecosystem: npm
    directory: /backend
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      backend-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /tests/browser-smoke
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      browser-smoke-dependencies:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /agent
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      agent-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    ignore:
      # Production images stay on the current LTS line. Review the next LTS
      # upgrade explicitly instead of following short-lived Current releases.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /frontend
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /agent
    open-pull-requests-limit: 0
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /deploy/caddy
    open-pull-requests-limit: 0
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /tests/browser-smoke
    open-pull-requests-limit: 0
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
